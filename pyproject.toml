[project]
name = "fraud"
version = "0.1.0"
description = "Real-time credit card fraud scoring API (FastAPI + scikit-learn + Postgres)"
readme = "README.md"
authors = [
    { name = "Alejandro Vargas", email = "alejandrov02430@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "pandas>=3.0.6",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
train = [
    "lightgbm>=4.7.0",
]

[tool.uv]
# Local 'uv sync' installs dev tools + training extras; the Docker image skips both.
default-groups = ["dev", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
